<div class="backdrop" (click)="closed.emit()"></div>
<aside class="panel" role="dialog" aria-modal="true" [attr.aria-label]="'Bus details, ' + s.bus().operator">
  <header class="head">
    <h2>Bus details</h2>
    <button #closeBtn class="x" type="button" aria-label="Close bus details" (click)="closed.emit()">
      <app-icon name="x" [size]="22" />
    </button>
  </header>

  <div class="tabs-wrap">
    <button type="button" class="tabs-arrow left" [class.show]="canLeft()" tabindex="-1" aria-hidden="true" (click)="nudge(-1)">
      <app-icon name="chevron-left" [size]="16" />
    </button>
    <nav #tabBar class="tabs" [class.dragging]="dragging()" role="tablist" aria-label="Bus details sections"
      (scroll)="updateArrows()" (wheel)="onTabsWheel($event)" (pointerdown)="dragStart($event)"
      (pointermove)="dragMove($event)" (pointerup)="dragEnd()" (pointercancel)="dragEnd()" (click)="swallowClick($event)">
      @for (t of tabs; track t.key) {
        <button type="button" role="tab" class="tab" [class.on]="active() === t.key" [attr.aria-selected]="active() === t.key"
          [attr.data-tab]="t.key" (click)="go(t.key)">{{ t.label }}</button>
      }
    </nav>
    <button type="button" class="tabs-arrow right" [class.show]="canRight()" tabindex="-1" aria-hidden="true" (click)="nudge(1)">
      <app-icon name="chevron-right" [size]="16" />
    </button>
  </div>

  <div #body class="body" (scroll)="onScroll()">
    <app-bus-info />
  </div>
</aside>
