<div class="page page--narrow">
  <label class="search">
    <app-icon name="search" [size]="18" />
    <input type="search" placeholder="Search for help" [value]="query()" (input)="query.set($any($event.target).value)" aria-label="Search for help" />
  </label>

  <h2 class="section-title">Help Categories</h2>
  <section class="card list cats">
    @for (c of visibleCategories(); track c.key) {
      <button class="list-row" [class.on]="cat() === c.key" (click)="pick(c.key)" [attr.aria-pressed]="cat() === c.key">
        <span class="tile" [class]="c.tone"><app-icon [name]="c.icon" /></span>
        <span class="grow"><div class="t">{{ c.title }}</div><div class="s">{{ c.sub }}</div></span>
        <app-icon class="chev" name="chevron-right" [size]="18" />
      </button>
    } @empty {
      <p class="small muted none">No categories match your search.</p>
    }
  </section>

  <h2 class="section-title">Frequently Asked Questions</h2>
  <section class="card list faqs">
    @for (f of visibleFaqs(); track f.q) {
      <div class="faq">
        <button class="list-row" (click)="toggle(f.q)" [attr.aria-expanded]="open() === f.q">
          <span class="grow t">{{ f.q }}</span>
          <app-icon class="chev" [name]="open() === f.q ? 'chevron-up' : 'chevron-down'" [size]="18" />
        </button>
        @if (open() === f.q) { <p class="answer small muted">{{ f.a }}</p> }
      </div>
    } @empty {
      <p class="small muted none">No answers found. Try different words or contact support.</p>
    }
  </section>

  <button class="btn btn-soft btn-block" (click)="contact()"><app-icon name="message" [size]="18" />Still need help? Contact support</button>
</div>
